# Ejemplo local: estos enlaces no comprueban disponibilidad ni integración.
- Bibliotecas:
    - RomM:
        icon: romm.png
        href: "http://localhost:8080"
        description: "Inventario opcional; instancia externa no incluida en Compose"
        server: local-docker
        container: romm
        showStats: true
    - Kavita:
        icon: kavita.png
