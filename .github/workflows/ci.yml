name: Runtime foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: make setup

      - name: Lint
        run: make lint

      - name: Type-check Web
        run: make typecheck

      - name: Runtime, SQLite, UDS, and manifest tests
        run: make test

      - name: Build Server, Agent, and Web
        run: make build
